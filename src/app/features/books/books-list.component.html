<div class="page-container">
  <app-page-header title="Books" subtitle="Publications and downloadable books">
    <app-search-input placeholder="Search books…" (search)="onSearch($event)" />

    <button mat-stroked-button [matMenuTriggerFor]="langMenu">
      <mat-icon>translate</mat-icon>
      {{ currentLangLabel() }}
      <mat-icon>arrow_drop_down</mat-icon>
    </button>
    <mat-menu #langMenu="matMenu">
      @for (opt of langOptions; track opt.value) {
        <button mat-menu-item (click)="onLangChange(opt.value)">{{ opt.label }}</button>
      }
    </mat-menu>

    @if (canWrite) {
      <button mat-stroked-button (click)="showImport.set(!showImport())">
        <mat-icon>upload_file</mat-icon>
        Import Excel
      </button>
      <button mat-flat-button color="primary" (click)="create()">
        <mat-icon>add</mat-icon>
        New book
      </button>
    }
  </app-page-header>

  @if (showImport()) {
    <app-book-excel-import
      (close)="showImport.set(false)"
      (imported)="load()">
    </app-book-excel-import>
  }

  @if (!loading() && rows().length === 0) {
    <app-empty-state
      icon="menu_book"
      [message]="search() ? 'No books match your search' : 'No books yet'"
      [hint]="search() ? 'Try a different search term.' : 'Add your first book.'"
    />
  } @else {
    <app-data-table
      [columns]="columns"
      [rows]="rows()"
      [actions]="actions"
      (action)="onAction($event)"
    ></app-data-table>
    <mat-paginator
      [length]="total()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[10, 20, 50]"
      (page)="onPage($event)"
    ></mat-paginator>
  }

  @if (!loading() && rows().length > 0) {
    <div class="d-flex justify-content-end mt-3">
      <button mat-stroked-button (click)="exportExcel()" [disabled]="exporting()">
        <mat-icon>download</mat-icon>
        {{ exporting() ? 'Exporting…' : 'Export Excel' }}
      </button>
    </div>
  }
</div>
