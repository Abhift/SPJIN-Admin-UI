<div class="page-container">
  <app-page-header title="Videos" subtitle="Video gallery">
    <app-search-input placeholder="Search videos…" (search)="onSearch($event)" />

    @if (canWrite) {
      <button mat-flat-button color="primary" (click)="create()">
        <mat-icon>add</mat-icon>
        New video
      </button>
    }
    <button mat-stroked-button [matMenuTriggerFor]="langMenu">
      <mat-icon>translate</mat-icon>
      {{ currentLangLabel() }}
      <mat-icon>arrow_drop_down</mat-icon>
    </button>
    <mat-menu #langMenu="matMenu">
      @for (opt of langOptions; track opt.value) {
        <button mat-menu-item (click)="selectedLang.set(opt.value)">{{ opt.label }}</button>
      }
    </mat-menu>
  </app-page-header>

  @if (!loading() && rows().length === 0) {
    <app-empty-state
      icon="smart_display"
      [message]="search() ? 'No videos match your search' : 'No videos yet'"
      [hint]="search() ? 'Try a different search term.' : 'Add your first video.'"
    />
  } @else {
    <app-data-table
      [columns]="columns"
      [rows]="rows()"
      [actions]="actions"
      (action)="onAction($event)"
    ></app-data-table>
    <mat-paginator
      [length]="total()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[10, 20, 50]"
      (page)="onPage($event)"
    ></mat-paginator>
  }
</div>
