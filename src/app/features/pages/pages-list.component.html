<div class="page-container">
  <app-page-header title="Pages" subtitle="Structured site pages and landing pages">
    <button mat-stroked-button [matMenuTriggerFor]="langMenu">
      <mat-icon>translate</mat-icon>
      {{ currentLangLabel() }}
      <mat-icon>arrow_drop_down</mat-icon>
    </button>
    <mat-menu #langMenu="matMenu">
      @for (opt of langOptions; track opt.value) {
        <button mat-menu-item (click)="onLangChange(opt.value)">{{ opt.label }}</button>
      }
    </mat-menu>

    @if (canWrite) {
      <button mat-flat-button color="primary" (click)="create()">
        <mat-icon>add</mat-icon>
        New page
      </button>
    }
  </app-page-header>

  @if (!loading() && rows().length === 0) {
    <app-empty-state icon="web" message="No pages yet" hint="Create your first page." />
  } @else {
    <app-data-table
      [columns]="columns"
      [rows]="rows()"
      [actions]="actions"
      (action)="onAction($event)"
    ></app-data-table>
    <mat-paginator
      [length]="total()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[10, 20, 50]"
      (page)="onPage($event)"
    ></mat-paginator>
  }
</div>
