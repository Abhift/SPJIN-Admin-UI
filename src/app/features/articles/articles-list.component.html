<div class="page-container">
  <app-page-header title="Articles" subtitle="News, blogs and long-form content">
    <app-search-input placeholder="Search articles…" (search)="onSearch($event)" />

    <button mat-stroked-button (click)="manageCategories()">
      <mat-icon>category</mat-icon>
      Categories
    </button>

    <button mat-stroked-button [matMenuTriggerFor]="langMenu">
      <mat-icon>translate</mat-icon>
      {{ currentLangLabel() }}
      <mat-icon>arrow_drop_down</mat-icon>
    </button>
    <mat-menu #langMenu="matMenu">
      @for (opt of langOptions; track opt.value) {
        <button mat-menu-item (click)="onLangChange(opt.value)">{{ opt.label }}</button>
      }
    </mat-menu>

    @if (canWrite) {
      <button mat-flat-button color="primary" (click)="create()">
        <mat-icon>add</mat-icon>
        New article
      </button>
    }
  </app-page-header>

  @if (!loading() && rows().length === 0) {
    <app-empty-state
      icon="article"
      [message]="search() ? 'No articles match your search' : 'No articles yet'"
      [hint]="search() ? 'Try a different search term.' : 'Write your first article.'"
    />
  } @else {
    <app-data-table
      [columns]="columns"
      [rows]="rows()"
      [actions]="actions"
      (action)="onAction($event)"
    ></app-data-table>
    <mat-paginator
      [length]="total()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[10, 20, 50]"
      (page)="onPage($event)"
    ></mat-paginator>
  }
</div>
